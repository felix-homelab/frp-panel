# Fork-local release.
#
# Like fork-checks.yml, this is a NEW file rather than an edit to tag.workflow.yml on
# purpose: this repository is a fork, and a new file can never produce a rebase conflict
# against upstream, whereas editing the shared workflow would conflict on every upstream
# change. The upstream tag workflows are disabled repo-side (Actions -> Workflows ->
# Disable) so the two do not race for the same release.
#
# It differs from upstream's tag.workflow.yml in exactly three ways:
#
#   1. `permissions: contents: write`. This repo's default GITHUB_TOKEN permission is
#      read-only, which is why upstream's workflow died with "Resource not accessible by
#      integration" on v0.10.0 -- a read-only token cannot create a release or upload
#      assets. An explicit permissions block overrides the repo default, so this works
#      without depending on a repo setting that a re-fork or a settings reset would lose.
#
#   2. Container images go to GitHub Container Registry (ghcr.io/<owner>/<repo>), not
#      Docker Hub. Upstream's ko steps need DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, which
#      are not set here, and are hardcoded to docker.io/vaalacat/frp-panel -- upstream's
#      namespace. GHCR takes this workflow's own token (`packages: write`), so there is no
#      registry secret to manage. The images themselves are built exactly like upstream's:
#      ko with .ko.yaml (alpine base, every platform alpine ships) and .ko.workerd.yaml.
#
#   3. Release notes are the tag's section of CHANGELOG.md, and a tag without one is not
#      released (.github/scripts/changelog-section.sh).
#
# The build steps below are copied verbatim from upstream's tag.workflow.yml. They are
# known-green on this fork as of v0.10.0 (that run reached the release step before
# failing), so they are deliberately not "cleaned up" -- notably the redundant-looking
# `npm install` before pnpm, which the frontend build in build.sh relies on in practice.
name: fork release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  # Pushing container images to ghcr.io.
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Release notes come from CHANGELOG.md, one section per tag. A tag without a section
      # fails here, before anything is built or published. Relative .md links are made
      # absolute, because they would not resolve on the release page.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          bash .github/scripts/changelog-section.sh "${GITHUB_REF_NAME}" CHANGELOG.md \
            | sed -E "s#\]\(([A-Za-z0-9_./-]+\.md)\)#](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)#g" \
            > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: npm setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: npm install and build
        run: |
          cd www
          npm install && npm install -g pnpm

      # build.sh stamps conf.gitVersion from GITHUB_REF_NAME when it is set (build.sh:24),
      # so the `version` subcommand reports the tag rather than `git describe` output.
      - name: Compile server
        run: bash ./build.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          # Appended below the CHANGELOG section: the commit and PR list for the tag.
          generate_release_notes: true
          # dist/ silently empty would publish a release with no binaries -- the exact
          # failure this workflow exists to prevent.
          fail_on_unmatched_files: true

      # install.sh downloads from the `latest` release tag by name, so upstream keeps a
      # rolling `latest` release alongside the versioned one. Preserved here.
      - name: Refresh rolling `latest` release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "${GITHUB_SHA}" \
              --notes "Rolling build of ${GITHUB_REF_NAME}."
          else
            gh release create latest --target "${GITHUB_SHA}" --title latest \
              --notes "Rolling build of ${GITHUB_REF_NAME}."
          fi
          gh release upload latest dist/* --clobber

      # Last on purpose: an image problem must never hold back the binaries above.
      # setup-ko logs in to ghcr.io with this job's token and sets
      # KO_DOCKER_REPO=ghcr.io/<owner>/<repo>; --bare pushes to exactly that name.
      - name: Setup ko
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ko-build/setup-ko@v0.9
        with:
          version: v0.19.1

      # The build above left the frontend in cmd/frpp/out, which the binary embeds.
      # The source label is what links the GHCR package to this repository.
      - name: Publish container images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          labels=(
            --image-label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --image-label "org.opencontainers.image.version=${GITHUB_REF_NAME}"
            --image-label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --image-label "org.opencontainers.image.licenses=AGPL-3.0"
          )
          ko build ./cmd/frpp --sbom=none --bare "${labels[@]}" -t "${GITHUB_REF_NAME}" -t latest

          # The workerd variant (Cloudflare workerd as the base, for agents that run
          # Workers). KO_CONFIG_PATH takes a directory, hence the copy.
          mkdir -p "${RUNNER_TEMP}/ko-workerd"
          cp .ko.workerd.yaml "${RUNNER_TEMP}/ko-workerd/.ko.yaml"
          KO_CONFIG_PATH="${RUNNER_TEMP}/ko-workerd" \
            ko build ./cmd/frpp --sbom=none --bare "${labels[@]}" \
            -t "${GITHUB_REF_NAME}-workerd" -t latest-workerd
